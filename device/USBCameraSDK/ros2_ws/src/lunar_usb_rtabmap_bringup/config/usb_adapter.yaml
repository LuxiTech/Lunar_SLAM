luxi_adapter:
  ros__parameters:
    hardware_profile: usb
    input_mode: rgbd
    rgbd_input_topic: /usb_stereo/rgbd_image

    color_input_topic: /usb_stereo/left/image_rect_color
    depth_input_topic: /usb_stereo/depth
    camera_info_input_topic: /usb_stereo/left/camera_info
    compressed_color_input_topic: /usb_stereo/left/image_rect_color/compressed
    imu_input_topic: /imu/data
    maximum_sensor_time_difference: 0.0

    rgbd_output_topic: /sensors/rgbd/rgbd_image
    color_output_topic: /sensors/rgbd/color/image_raw
    depth_output_topic: /sensors/rgbd/depth/image_raw
    camera_info_output_topic: /sensors/rgbd/color/camera_info
    compressed_color_output_topic: /sensors/rgbd/color/image_raw/compressed
    imu_output_topic: /sensors/imu/data_raw
    imu_orientation_output_topic: /sensors/imu/data
    reliable_image_output: true
    # Browser preview is generated from the same rectified CRE RGB-D packet
    # used by odometry, not from a separately restarting 1080p UVC topic.
    generate_compressed_color_from_raw: true
    enable_compressed_color: true
    compressed_color_rate: 5.0
    compressed_color_jpeg_quality: 80
    enable_imu: false
