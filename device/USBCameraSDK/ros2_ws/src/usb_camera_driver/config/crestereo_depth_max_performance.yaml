usb_crestereo_depth_node:
  ros__parameters:
    calibration_file: ''
    model_path: ''
    compressed_input: true
    left_image_topic: /left_camera/image/compressed
    right_image_topic: /right_camera/image/compressed
    color_output_topic: /usb_stereo/left/image_rect_color
    preview_output_topic: /usb_stereo/left/image_preview
    depth_output_topic: /usb_stereo/depth
    depth_preview_output_topic: /usb_stereo/depth_preview
    camera_info_output_topic: /usb_stereo/left/camera_info
    rgbd_output_topic: /usb_stereo/rgbd_image
    point_cloud_output_topic: /usb_stereo/points
    disparity_output_topic: /usb_stereo/disparity
    output_frame_id: left_camera_optical_frame

    # 180x320 is the largest deployed CREStereo model that can keep pace with
    # the camera's native 10 Hz stream on this Orin NX. RGB-D is rectified at
    # half the camera dimensions; geometric detail remains model-limited and
    # is not presented as native 960x540 learned depth.
    execution_provider: cuda
    enable_cuda_graph: true
    use_cuda_io_binding: true
    tensorrt_cache_path: ~/.cache/luxi/crestereo
    output_width: 960
    output_height: 540
    target_rate: 10.0

    # Decode the two native 1920x1080 JPEGs and rectify model/output views in
    # parallel. A one-frame CPU/GPU pipeline keeps data fresh without a queue.
    opencv_num_threads: 2
    preprocess_threads: 3
    pipeline_preprocessing: true
    use_fixed_point_remap: true

    min_depth_m: 0.4
    max_depth_m: 10.0
    max_vertical_flow_px: 2.0
    # Reject inconsistent stereo warps after compensating the cameras' global
    # brightness difference. Live data retained 93.4% of valid depth at 35.
    photometric_threshold: 35.0
    far_artifact_depth_m: 4.0
    far_artifact_support_size: 3
    far_artifact_minimum_support: 3
    output_median_filter_size: 3
    output_median_max_difference_m: 0.12
    # Replace 3x nearest-neighbor depth blocks with RGB-guided disparity
    # upsampling. This adds boundary detail without another neural pass.
    guided_upsampling_radius: 4
    guided_upsampling_epsilon: 100.0
    # Solve guidance at 480 px and interpolate the edge-aligned result to the
    # 960 px RGB-D output; full-size guidance reduced live throughput to 8.5 Hz.
    guided_upsampling_width: 480

    # Latest on-robot measurement puts the optical center about 0.35 m above
    # level ground. A walking D1 pitches and rolls, so the learned frontend
    # applies this repair to RTAB depth with synchronized H30 gravity instead.
    ground_plane_prior_enabled: false
    ground_plane_camera_height_m: 0.35
    ground_plane_below_tolerance_m: 0.12
    ground_plane_minimum_row_ratio: 0.56

    # Point clouds are visualization only; RTAB-Map consumes full-rate RGB-D.
    # Bound preview generation so opening RViz cannot delay odometry.
    point_cloud_max_fps: 3.0
    point_cloud_max_depth_m: 3.0
    point_cloud_far_sparse_start_m: 0.0
    point_cloud_medium_max_depth_m: 0.0
    point_cloud_medium_sparse_pixel_step: 1
    point_cloud_far_sparse_pixel_step: 1
    log_every_n: 30
    publish_split_topics: true
