stereo_node:
  ros__parameters:
    left_device: /dev/v4l/by-path/pci-0000:00:14.0-usb-0:8:1.0-video-index0
    right_device: /dev/v4l/by-path/pci-0000:00:14.0-usb-0:7:1.0-video-index0
    pixel_format: MJPG
    output_encoding: mono8
    width: 1920
    height: 1080
    frame_rate_hz: 10.0
    trigger_mode: hardware
    # Keep raw host timestamps while recording a new Kalibr dataset.
    timestamp_offset_sec: 0.0
    auto_exposure: true
    exposure_absolute: -1
    gain: -1
    left_frame_id: left_camera_optical_frame
    right_frame_id: right_camera_optical_frame
