usb_crestereo_depth_node:
  ros__parameters:
    calibration_file: ''
    model_path: ''
    compressed_input: true
    left_image_topic: /left_camera/image/compressed
    right_image_topic: /right_camera/image/compressed
    color_output_topic: /usb_stereo/left/image_rect_color
    preview_output_topic: /usb_stereo/left/image_preview
    depth_output_topic: /usb_stereo/depth
    depth_preview_output_topic: /usb_stereo/depth_preview
    camera_info_output_topic: /usb_stereo/left/camera_info
    rgbd_output_topic: /usb_stereo/rgbd_image
    point_cloud_output_topic: /usb_stereo/points
    disparity_output_topic: /usb_stereo/disparity
    output_frame_id: left_camera_optical_frame

    # Primary mapping profile: use the model's native 640x360 geometry. The
    # 320x180 model remains available as the explicit 10 Hz CRE MAX mode.
    execution_provider: cuda
    enable_cuda_graph: true
    use_cuda_io_binding: true
    tensorrt_cache_path: ~/.cache/luxi/crestereo
    output_width: 640
    output_height: 360
    target_rate: 3.0

    opencv_num_threads: 2
    preprocess_threads: 3
    pipeline_preprocessing: true
    use_fixed_point_remap: true

    min_depth_m: 0.4
    max_depth_m: 10.0
    max_vertical_flow_px: 2.0
    # 35 admitted reflective-floor and object-edge ghosts in map100. Keep
    # textured surfaces but reject the visibly inconsistent correspondences.
    photometric_threshold: 28.0
    # Normalize the two physical sensors before inference, then require both
    # subpixel pixel agreement and 5x5 patch support. The patch gate targets
    # view-dependent floor highlights without deleting ordinary wall texture.
    stereo_photometric_normalization: true
    stereo_photometric_minimum_gain: 0.80
    stereo_photometric_maximum_gain: 1.25
    stereo_photometric_maximum_offset: 30.0
    photometric_patch_size: 5
    photometric_patch_threshold: 18.0
    # A second flipped right-to-left pass is the learned equivalent of a
    # stereo confidence check. It costs GPU time but prevents one-view floor
    # reflections and occlusions from becoming persistent map obstacles.
    left_right_consistency: true
    left_right_maximum_difference_px: 1.0
    left_right_model_path: ''
    far_artifact_depth_m: 4.0
    far_artifact_support_size: 5
    far_artifact_minimum_support: 8
    output_median_filter_size: 3
    output_median_max_difference_m: 0.06

    # Native model/output grids are identical. Guidance upsampling would add
    # no learned detail and may smear disparity across object boundaries.
    guided_upsampling_radius: 0
    guided_upsampling_epsilon: 100.0
    guided_upsampling_width: 0

    # Preserve scene geometry; terrain segmentation happens after fusion.
    ground_plane_prior_enabled: false
    ground_plane_camera_height_m: 0.35
    ground_plane_below_tolerance_m: 0.12
    ground_plane_minimum_row_ratio: 0.56

    point_cloud_max_fps: 3.0
    point_cloud_max_depth_m: 4.0
    point_cloud_far_sparse_start_m: 0.0
    point_cloud_medium_max_depth_m: 0.0
    point_cloud_medium_sparse_pixel_step: 1
    point_cloud_far_sparse_pixel_step: 1
    log_every_n: 15
    publish_split_topics: true
