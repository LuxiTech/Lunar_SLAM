# Experimental camera--IMU calibration imported from Kalibr.
#
# Source bag: kalibr_data/stereo_imu_dynamic_04_ros2
# Source result: indexed_04_full/stereo_imu_dynamic_04_full_padded-camchain-imucam.yaml
#
# IMPORTANT: This result is imported for functional testing only.  Its image
# reprojection error is about 4 px, so it must be replaced by a new, better
# motion calibration before using it for accurate VIO/SLAM.
kalibr_camera_imu:
  status: experimental
  reference_camera_frame: left_camera_optical_frame
  imu_frame: imu_link

  # Kalibr T_cam0_imu: transforms a point from imu_link into
  # left_camera_optical_frame. This is the exact parent->child transform
  # published by stereo_imu_calibrated.launch.py.
  translation_m: [0.05740985968686727, 0.02595491340073357, -0.057732071298254306]
  rotation_xyzw: [0.508445592440157, -0.485493288077626, 0.494171813224474, 0.511442631948285]
  transform_matrix:
    - [0.04018097249202174, -0.9991749105450595, 0.005915030588992343, 0.05740985968686727]
    - [0.011787220615666949, -0.00544540291477269, -0.9999157009554627, 0.02595491340073357]
    - [0.9991228907795846, 0.040247307044932956, 0.011558693519507446, -0.057732071298254306]
    - [0.0, 0.0, 0.0, 1.0]

  # Kalibr convention: t_imu = t_camera + camera_to_imu_time_offset_sec.
  # A static TF has no time-shift capability; pass this value to a VIO/fusion
  # package that supports camera/IMU temporal calibration.
  camera_to_imu_time_offset_sec: -0.03771040706220908
  right_camera_to_imu_time_offset_sec: -0.03610817567541563

  quality:
    cam0_reprojection_mean_px: 3.9925
    cam1_reprojection_mean_px: 4.0730
    note: 'For testing only; recalibrate with better target coverage and motion.'
