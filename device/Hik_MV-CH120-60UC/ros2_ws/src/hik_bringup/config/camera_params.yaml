stereo_node:
  ros__parameters:
    # Do not override external_trigger here. The MVS/UserSet-compatible value
    # in the package's stereo_camera.xml is the single source of truth for
    # acquisition mode.  Config and calibration defaults are resolved through
    # ament_index_cpp, so this file is portable after colcon install.
    # Keep one explicit parameter: the Humble parameter-file parser rejects an
    # otherwise empty ros__parameters map.
    rviz_preview_scale: 0.25
