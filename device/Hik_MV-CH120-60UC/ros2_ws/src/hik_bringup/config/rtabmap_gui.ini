; RTAB-Map Qt GUI configuration for 1024x750 stereo input.
; The GUI default is decimation=4, but 750 is not divisible by 4.  Using 2
; prevents cloudFromDepthRGB warnings and avoids the GUI falling back per frame.
[Gui]
General\decimation0=2
General\decimation1=2
; Keep the map pane useful without retaining unbounded historical render data.
General\cloudsKept=false
