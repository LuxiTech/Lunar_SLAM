stereo_depth_node:
  ros__parameters:
    # Topics consumed by the depth node
    left_image_topic: /left_camera/image
    right_image_topic: /right_camera/image
    left_info_topic: /left_camera/camera_info
    right_info_topic: /right_camera/camera_info
    # Empty means use /left_camera/image and /right_camera/image directly.
    # This preserves color for RViz RGB images and RGB point clouds. The packed
    # /stereo_camera/image_pair_mono topic is grayscale-only.
    stereo_pair_topic: ''

    # Orin NX full hardware stereo: OFA performs eSGM, PVA performs the
    # confidence/median stage and VIC performs block-linear conversion. CUDA-SGM
    # and OpenCV SGBM remain selectable fallbacks.
    depth_backend: vpi_ofa_pva_vic
    vpi_fallback_to_sgbm: true
    # The current calibration has positive P[3] on cam1, so valid disparities
    # are right-minus-left. Mirror both images before VPI so it can search
    # positive disparity while still producing depth directly on the left
    # image grid. This avoids holes from right-to-left forward remapping.
    matcher_input_order: left_right_flipped
    # Re-measured on 2026-08-06 after rectification. A constant vertical shift
    # alone left about 3.6 px of edge-to-edge epipolar slope. Correct the
    # measured relative roll in the rectification rotation itself, without a
    # second image interpolation. The remaining measured slope is <0.5 px over
    # the full 1024 px image width.
    right_rectification_y_offset_px: 5.58
    right_rectification_roll_deg: -0.1785
    # VPI returns Q10.5 disparity. Reject low-confidence matches before CPU
    # post-filtering to suppress low-texture speckle in the map.
    # Low-texture walls can otherwise be filled with confident-looking but
    # geometrically inconsistent disparity. Prefer plane quality over an
    # inflated valid-pixel percentage.
    # Absolute confidence performs a hardware left/right disparity consistency
    # check. This is more conservative than the CNN score on blank painted
    # walls, where visually plausible but false matches caused radial rays.
    vpi_confidence_type: absolute
    # Reject low-texture correspondences unless the hardware left/right check
    # agrees closely. 64500 removed the long wall rays in the measured scene
    # while retaining enough structured depth for learned RGB-D odometry.
    vpi_confidence_threshold: 64500
    vpi_p1: 8
    vpi_p2: 81
    vpi_uniqueness: -1.0
    vpi_ofa_window_size: 7
    # Two directional aggregation passes balance low-texture wall quality with
    # the 10 Hz hardware input rate on Orin NX.
    vpi_ofa_num_passes: 2
    vpi_ofa_apply_cpu_postfilters: false

    # OpenCV SGBM parameters (used only when depth_backend: sgbm, or if VPI
    # initialization/runtime fails and vpi_fallback_to_sgbm is true).
    # Use the right projection matrix to derive baseline automatically.
    # The current projection matrices give about 0.095965 m.
    baseline_m: 0.0
    max_disparity: 128
    block_size: 7
    pre_filter_size: 9
    pre_filter_cap: 31
    uniqueness_ratio: 10
    speckle_size: 80
    speckle_range: 4
    disp12_max_diff: 2
    median_blur_size: 3
    texture_filter_min_gradient: 2.0
    depth_edge_filter_max_delta_m: 0.10
    depth_neighbor_filter_min_count: 2
    depth_neighbor_filter_max_delta_m: 0.10
    # Millimetre uint16 depth halves DDS bandwidth at 1024x750. Stereo depth
    # uncertainty is far larger than 1 mm, so this does not reduce usable precision.
    depth_output_encoding: 16UC1

    rectify_images: true
    # Match the 1024x750 ROS camera stream exactly. Capture-side scaling already
    # reduces NX load while preserving the full field of view.
    processing_scale: 1.0
    # The GPU-SGM full-resolution pipeline follows the 10 Hz hardware trigger.
    max_processing_fps: 0.0
    # Keep OpenCV below the camera/depth executor's core count. Three workers
    # retain parallel rectification while avoiding eight-core bursts that
    # starve capture, DDS and the web process on Orin NX.
    # Three workers are the measured minimum needed to sustain the 10 Hz
    # 1024x750 rectification path; one worker falls to about 7.7 Hz.
    opencv_num_threads: 3
    # Publish a coloured depth view for every computed depth frame. It is
    # intentionally separate from the 10 Hz camera-only RViz previews.
    # Web/RViz JPEG is display-only. Keep SLAM RGBD/depth at 10 Hz while
    # encoding the latest preview at 5 Hz to remove avoidable libjpeg CPU work.
    preview_publish_every_n_frames: 2
    point_cloud_step: 4
    # fx*baseline=43.6732 pixel*m and max disparity=128 give a 0.341 m
    # theoretical near limit. Keep the complete, photometrically verified
    # sensor output here; RTAB-Map independently limits mapping to 4.5 m.
    min_depth_m: 0.35
    max_depth_m: 6.0
