stereo_depth_node:
  ros__parameters:
    # Topics consumed by the depth node
    left_image_topic: /left_camera/image
    right_image_topic: /right_camera/image
    left_info_topic: /left_camera/camera_info
    right_info_topic: /right_camera/camera_info
    # One message contains left and right mono images side by side. This avoids
    # dropping only one side of a large stereo pair in DDS transport.
    stereo_pair_topic: /stereo_camera/image_pair_mono

    # Stereo matching parameters (tune these first for better depth quality)
    # Use the right projection matrix to derive baseline automatically.
    # The current calibration gives about 0.100523 m.
    baseline_m: 0.0
    max_disparity: 96
    block_size: 9
    pre_filter_size: 9
    pre_filter_cap: 31
    uniqueness_ratio: 15
    speckle_size: 100
    speckle_range: 4

    rectify_images: true
    # 0.5 processes 1024x750 instead of 2048x1500 for much higher throughput.
    # Use 0.75 for more detail, or 1.0 for full-resolution accuracy.
    processing_scale: 0.5
    point_cloud_step: 6
    min_depth_m: 0.2
    max_depth_m: 10.0
