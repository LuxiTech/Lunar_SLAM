web_control:
  ros__parameters:
    # Standard output topic. Remap or change this for any compatible robot.
    cmd_vel_topic: /cmd_vel

    # HTTP server. Use 127.0.0.1 if the page must not be exposed to the LAN.
    bind_address: 0.0.0.0
    http_port: 8080
    auto_stop_existing_web_control: true

    # A held web control is refreshed at 10 Hz; output is published at 20 Hz.
    publish_rate: 20.0
    # Restore the proven pre-main control watchdog. Pointer release and
    # emergency stop still publish zero immediately.
    command_timeout: 0.6

    # Server-side safety limits, independent of browser slider values.
    max_linear_x: 0.25
    max_linear_y: 0.0
    max_angular_z: 0.8
    enable_output: true

    # D1 stand/lie-down and C++ /cmd_vel bridge control shown as a web switch.
    # Select exactly one robot. Feedback services and the bridge output topic
    # are derived from this namespace unless explicitly overridden below.
    robot_namespace: d15041873
    enable_d1_control: true
    # Empty names follow robot_namespace, so the same web configuration works
    # for d15041873 and d15042176.
    d1_fsm_topic: ""
    d1_controller_status_service: ""
    d1_parameter_service: ""
    # Stable interfaces republished/consumed by slam_d1_bridge. The web UI does
    # not couple itself to the D1 vendor's internal battery topics.
    d1_battery1_topic: ""
    d1_battery2_topic: ""
    d1_body_height_command_topic: ""
    d1_body_height_status_topic: ""
    # Old level 9 (30% of 0..30) is now the web's 100% endpoint.
    d1_body_height_minimum: 0.0
    d1_body_height_maximum: 9.0
    d1_body_height_default: 0.0
    d1_feedback_timeout: 3.0
    # Covers worst-case DDS discovery, SDK service response and posture change.
    d1_transition_timeout: 90.0

    # The web button starts a short-lived H30-only process, collects gravity,
    # saves one mount quaternion per robot namespace, then releases the serial
    # port before mapping/navigation starts its normal USB sensor chain.
    imu_level_calibration_service: /sensors/imu/calibrate_level
    imu_level_status_topic: /sensors/imu/level_calibration_status
    imu_level_standalone_enabled: true
    imu_level_calibration_launch_package: lunar_usb_rtabmap_bringup
    imu_level_calibration_launch_file: usb_imu_level_calibration.launch.py
    imu_level_calibration_sensor_setup: device/USBCameraSDK/ros2_ws/install/setup.bash
    imu_level_calibration_workspace_setup: install/setup.bash
    imu_level_calibration_log_path: log/luxi_web_control_imu_calibration.log
    imu_level_calibration_store_path: maps/calibration/{robot_namespace}_camera_mount.json
    imu_level_calibration_start_timeout: 12.0
    imu_level_calibration_result_timeout: 20.0
    imu_level_calibration_samples: 200
    # Optical-frame nominal yaw: base +X forward -> camera optical +Z.
    imu_level_camera_yaw_degrees: -90.0

    # The API selects an explicit USB launch: stable CREStereo is the default,
    # CREStereo MAX is the opt-in 10 Hz profile and VPI is the fallback.
    enable_mapping_control: true
    mapping_launch_package: lunar_usb_rtabmap_bringup
    mapping_launch_file: usb_rtabmap.launch.py
    mapping_launch_arguments:
      - new_map:=true
      - rviz:=false
      - rtabmap_viz:=false
      - use_imu:=true
      - planar_mode:=false
      # D1 trunk rotation center -> left camera optical center. The user
      # measured the centered stereo midpoint at (+0.20, 0, +0.20) m; add
      # half of the calibrated 89.963 mm baseline toward robot-left.
      - camera_x:=0.20
      - camera_y:=0.044982
      - camera_z:=0.20
      # Camera is horizontal and forward-facing. These map ROS base axes
      # (x forward, y left, z up) to the optical frame convention.
      - camera_qx:=-0.5
      - camera_qy:=0.5
      - camera_qz:=-0.5
      - camera_qw:=0.5
    # The second D1 carries a different USB stereo module. It has no external
    # trigger input, so its capture profile must not reuse the first module's
    # hardware-trigger setting.
    mapping_robot_camera_profiles:
      - d15042176=device/USBCameraSDK/ros2_ws/src/usb_camera_driver/config/stereo_camera_d15042176.yaml
    # H30 is the default rotation source for both CREStereo profiles.
    # Startup is rejected if the serial stream or any required axis is invalid.
    mapping_crestereo_use_imu: true
    # Retained for the device-independent launch; the USB launch continues to
    # use mapping_launch_arguments/planar_mode and is not changed by this value.
    mapping_planar_motion: true
    # Mapping is refused unless each canonical input has exactly one publisher.
    # Duplicate IMU/filter pipelines caused map024 trajectory deformation.
    mapping_rgbd_topic: /sensors/rgbd/rgbd_image
    mapping_imu_topic: /sensors/imu/data
    # Match the USB camera profile and LeKiwi web launch on the NX. The mapping
    # child uses the same RMW as the sensor pipeline.
    mapping_rmw_implementation: rmw_fastrtps_cpp
    mapping_sensor_setup: device/USBCameraSDK/ros2_ws/install/setup.bash

    # Map pairs are discovered as rtab_maps/mapNNN.db and
    # octo_maps/mapNNN_octomap/mapNNN.bt. Loading also reads the saved
    # colored PLY and occupied voxels for immediate browser display. It never
    # enables the path follower by itself.
    enable_navigation_control: true
    # Saved-map localization must own the same USB CREStereo/H30 producer as
    # mapping; otherwise HLoc subscribes to /sensors/rgbd with no publisher.
    navigation_launch_package: lunar_usb_rtabmap_bringup
    navigation_launch_file: usb_crestereo_saved_map_navigation.launch.py
    navigation_launch_arguments:
      - use_imu:=true
      - camera_x:=0.20
      - camera_y:=0.044982
      - camera_z:=0.20
      - camera_qx:=-0.5
      - camera_qy:=0.5
      - camera_qz:=-0.5
      - camera_qw:=0.5
    navigation_rmw_implementation: rmw_fastrtps_cpp
    navigation_sensor_setup: device/USBCameraSDK/ros2_ws/install/setup.bash
    maps_root: ""
    # Selecting a database without exported layers runs tools/export_rtabmap_octomap.sh.
    # The database must already be saved; this limits the one-shot export duration.
    map_conversion_timeout: 300.0
    # Building happens only when the operator explicitly clicks "自动定位",
    # after mapping/navigation processes have stopped. Plain map display stays
    # light-weight while a missing index no longer makes localization unusable.
    auto_build_hloc_index: true
    hloc_index_build_timeout: 900.0
    navigation_goal_topic: /navigation/goal_pose
    navigation_marker_topic: /navigation/occupied_voxels
    navigation_path_topic: /navigation/planned_path
    navigation_planning_status_topic: /navigation/planning_status
    navigation_start_topic: /navigation/start
    navigation_stop_topic: /navigation/stop
    navigation_active_topic: /navigation/active
    navigation_follower_state_topic: /navigation/follower_state
    navigation_emergency_stop_topic: /navigation/emergency_stop
    # Goal selection is disabled until HLoc publishes a geometrically verified pose.
    navigation_localization_pose_topic: /luxi_hloc/coarse_pose
    # HLoc supplies the global candidate; luxi_location refines it with ICP.
    navigation_refined_pose_topic: /luxi_location/pose
    # C++ planner projects stable XY/yaw localization onto the 3D terrain surface.
    navigation_terrain_pose_topic: /navigation/terrain_pose
    navigation_refined_fitness_topic: /luxi_location/fitness
    navigation_refined_status_topic: /luxi_location/status
    navigation_localization_max_variance: 0.5
    navigation_localization_timeout: 3.0
    # New goals require recent geometric overlap with the map. The configured
    # local-odometry authority may reject a large correction even at high fitness.
    navigation_icp_verification_timeout: 20.0
    navigation_icp_minimum_fitness: 0.25
    max_voxel_points: 12000
    # Terrain classification is generated by the shared C++ planner library.
    navigation_robot_radius: 0.10
    navigation_costmap_margin: 0.60
    navigation_ground_normal_radius: 0.30
    navigation_ground_max_slope_degrees: 35.0
    navigation_obstacle_min_height: 0.15
    # map018 takes about 66 s to fit normals/terrain on this CPU.
    navigation_terrain_load_timeout: 90.0
    max_terrain_points: 12000

    # Keep the lightweight RGB preview plus the bounded USB mapping cloud used
    # to judge CRE depth quality. The point cap below prevents unbounded HTTP
    # payload growth.
    enable_preview: true
    # Unified, rectified preview generated from the exact RGB-D packet used by
    # CRE odometry. It survives raw UVC publisher restarts between map runs.
    # Retain the USB mapping cloud required by the current NX visualization.
    # Deployments prioritizing navigation bandwidth can turn this off.
    enable_cloud_preview: true
    rgb_preview_topic: /sensors/rgbd/color/image_raw/compressed
    cloud_preview_topic: /rtabmap/cloud_map
    max_cloud_points: 5000
    # Safety cap for deployments that explicitly re-enable the optional live
    # cloud API. Saved navigation maps are unaffected.
    max_saved_cloud_points: 30000
    semantic_annotation_timeout: 15.0
    semantic_maps_root: ""
