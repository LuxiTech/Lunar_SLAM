luxi_adapter:
  ros__parameters:
    # Exactly one profile is selected by sensor_bringup.launch.py.
    hardware_profile: d435i
    input_mode: separate
    rgbd_output_topic: /sensors/rgbd/rgbd_image
    maximum_sensor_time_difference: 0.05

    # Vendor driver inputs for the selected D435i profile.
    color_input_topic: /camera/camera/color/image_raw
    depth_input_topic: /camera/camera/aligned_depth_to_color/image_raw
    camera_info_input_topic: /camera/camera/color/camera_info
    imu_input_topic: /camera/camera/imu
    compressed_color_input_topic: /camera/camera/color/image_raw/compressed

    # Project-wide hardware-independent interface consumed by algorithms.
    color_output_topic: /sensors/rgbd/color/image_raw
    depth_output_topic: /sensors/rgbd/depth/image_raw
    camera_info_output_topic: /sensors/rgbd/color/camera_info
    imu_output_topic: /sensors/imu/data_raw
    compressed_color_output_topic: /sensors/rgbd/color/image_raw/compressed
    # RealSense publishes raw RGB only. Generate a bounded on-demand JPEG
    # preview for web clients without changing the algorithm RGB-D stream.
    generate_compressed_color_from_raw: true
    compressed_color_rate: 5.0
    compressed_color_jpeg_quality: 80
    enable_imu: true

    # Runtime configuration for the D435i profile.
    # Empty selects device/D435i/ros2_ws/install/setup.bash under the detected workspace.
    d435i_setup: ""
    rmw_implementation: rmw_fastrtps_cpp
    ros_domain_id: 42
    d435i_color_profile: 640,480,30
    d435i_depth_profile: 640,480,30
    d435i_initial_reset: false
    d435i_unite_imu_method: 2

    # Estimated mounting transform: D435i is 0.13-0.15 m in front of the
    # robot's rotation center. Use the midpoint until it is measured.
    base_frame: base_link
    camera_frame: camera_link
    camera_x: 0.14
    camera_y: 0.0
    camera_z: 0.0
    camera_roll: 0.0
    camera_pitch: 0.0
    camera_yaw: 0.0
    # The robot must remain stationary on level ground at sensor startup.
    # Gravity estimates camera roll/pitch; yaw and translation remain configured above.
    auto_level_imu: true
    auto_level_start_automatically: false
    imu_level_calibration_service: /sensors/imu/calibrate_level
    imu_level_status_topic: /sensors/imu/level_calibration_status
    auto_level_samples: 200
    auto_level_gravity_tolerance: 0.8
    auto_level_maximum_angular_speed: 0.05
    auto_level_maximum_tilt_degrees: 40.0

sensor_imu_filter:
  ros__parameters:
    use_mag: false
    world_frame: enu
    publish_tf: false
    gain: 0.03
