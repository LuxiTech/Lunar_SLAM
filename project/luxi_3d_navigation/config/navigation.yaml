octomap_3d_astar_planner:
  ros__parameters:
    # Measured center-to-wheel distance. The camera/rear extents are smaller.
    robot_radius: 0.25
    robot_height: 0.35
    # base_link is near the body/rotation reference. Terrain cells represent
    # support-surface clearance, so start snapping must remove this height.
    body_reference_height: 0.35
    max_step_height: 0.15
    max_slope_degrees: 50.0
    strict_direct_ground_support: false
    ground_support_xy_radius_cells: 1
    ground_support_depth_cells: 2
    snap_search_radius_cells: 12
    max_iterations: 500000
    # The model applies this outside the 0.25 m hard robot radius, so the
    # outer cost boundary is 0.25 + 0.15 = 0.40 m from an obstacle.
    costmap_margin: 0.15
    costmap_weight: 8.0
    ground_normal_radius: 0.30
    ground_max_slope_degrees: 35.0
    obstacle_min_height: 0.15

local_path_replanner:
  ros__parameters:
    robot_radius: 0.25
    robot_height: 0.35
    body_reference_height: 0.35
    max_step_height: 0.15
    max_slope_degrees: 50.0
    strict_direct_ground_support: false
    ground_support_xy_radius_cells: 1
    ground_support_depth_cells: 2
    snap_search_radius_cells: 12
    max_iterations: 500000
    costmap_margin: 0.15
    costmap_weight: 8.0
    ground_normal_radius: 0.30
    ground_max_slope_degrees: 35.0
    obstacle_min_height: 0.15
    dynamic_inflation_radius: 0.25
    # Plan 5 cm farther out than the hard clearance used to validate an active
    # path, avoiding stop/replan oscillation from normal depth-point jitter.
    dynamic_replan_hysteresis: 0.05
    # Ignore one-frame path intersections while the forward safety corridor is
    # not blocked; at 0.1 m/s this hold permits at most 5 cm of travel.
    active_path_blocked_hold: 0.50
    rejoin_min_distance: 0.80
    planning_horizon: 3.0
    local_window_margin: 1.0
    replan_rate: 2.0

local_obstacle_map:
  ros__parameters:
    # Keep near-field sensing alive through a temporary global map relocalization.
    target_frame: odom
    base_frame: base_link
    resolution: 0.05
    # Stored in map axes, so a 6 m square covers a 3 m radius at every yaw.
    size_x: 6.0
    size_y: 6.0
    size_z: 1.5
    minimum_depth: 0.25
    maximum_depth: 2.5
    # A 12-pixel stride is still about 1 cm at 0.5 m range and keeps the
    # obstacle callback near 10 Hz on this CPU instead of saturating one core.
    skip_pixel: 12
    # Every endpoint can add an obstacle; only a subset needs expensive free-space rays.
    raycast_stride: 4
    hit_increment: 1
    miss_decrement: 1
    occupied_threshold: 2
    minimum_score: -3
    maximum_score: 5
    # Keep an unobserved obstacle long enough for this slow robot to pass it
    # after turning it out of the D435i field of view. Explicit free-space rays
    # still clear an object immediately when the camera sees that it moved.
    occupied_ttl: 30.0
    stale_entry_ttl: 35.0
    minimum_obstacle_z: -0.32
    maximum_obstacle_z: 0.30
    # Measured footprint relative to the rotation center: rear 0.15 m,
    # front-mounted camera 0.18 m, wheel radius envelope 0.25 m laterally.
    self_filter_x_min: -0.15
    self_filter_x_max: 0.18
    self_filter_half_width: 0.25
    corridor_half_width: 0.25
    stop_distance: 0.45
    slow_distance: 0.70
    # D455 occasionally has a 1-2 s UVC recovery gap. The rolling layer marks
    # itself stale after this interval; the safety gate immediately outputs
    # zero, so increasing the permanent-latch delay below does not permit blind
    # travel.
    sensor_timeout: 0.60
    tf_timeout: 0.05
    # More dangerous transitions are immediate; clearing must remain stable.
    state_clear_hold: 0.50
    publish_rate: 10.0
    rotation_clearance_topic: /navigation/local_obstacles/rotation_clearance

navigation_safety_gate:
  ros__parameters:
    monitor_only: false
    command_timeout: 0.20
    obstacle_timeout: 0.60
    # Stop immediately on a stale/invalid depth layer, but latch the stop only
    # when the D455 fault lasts long enough to be a real disconnect. A normal
    # short UVC watchdog recovery therefore resumes after healthy_resume_hold.
    obstacle_hard_stop_latch_delay: 2.5
    planner_timeout: 1.0
    # The D455 RGB-D odometry stream showed occasional 1.8 s gaps. Obstacle
    # sensing still fail-stops immediately during those gaps.
    localization_timeout: 2.2
    slow_scale: 0.50
    # D1's walking controller does not execute smaller translational commands.
    # Slow mode remains flagged/limited but preserves this hardware floor.
    minimum_linear_speed: 0.10
    healthy_resume_hold: 0.50
    # Keep the odometry/IMU track for at most 0.8 s after ICP health drops.
    # At D1's 0.10 m/s hardware floor this limits blind travel to about 8 cm.
    dead_reckoning_duration: 0.80
    dead_reckoning_scale: 0.50
    # Recovery is angular-only. A fresh clear/slow rolling obstacle layer is
    # required; a blocked or stale layer still forces zero velocity.
    maximum_recovery_angular_speed: 0.20
    # A blocked forward corridor may still permit an angular-only turn when
    # every measured obstacle around the robot stays outside the 0.25 m swept
    # footprint plus 5 cm. This is intentionally not just a forward-distance
    # check.
    rotation_clearance_topic: /navigation/local_obstacles/rotation_clearance
    minimum_obstacle_rotation_clearance: 0.30
    maximum_obstacle_recovery_angular_speed: 0.20
    publish_rate: 20.0

terrain_path_follower:
  ros__parameters:
    max_linear_speed: 0.10
    minimum_linear_speed: 0.10
    max_angular_speed: 0.35
    # Ignore small heading errors so uncalibrated camera lever-arm motion does
    # not make short paths oscillate. Rotate in place only for larger errors.
    angular_deadband: 0.15
    linear_heading_tolerance: 0.35
    lookahead_m: 0.25
    goal_tolerance_m: 0.12
    goal_yaw_tolerance: 0.15
    # D1 gait does not respond predictably below 0.10 m/s. Keep enough stopping
    # margin even if a smaller runtime tolerance is requested accidentally.
    minimum_safe_goal_tolerance_m: 0.12
    # Brief ICP loss keeps the continuous RGB-D odometry/IMU pose alive. If it
    # persists, stop translation and keep turning toward the last path heading
    # while HLoc searches for a confirmed global match.
    localization_timeout: 2.2
    dead_reckoning_duration: 0.80
    # A verifying/searching localization now rotates in the last commanded
    # turn direction after the short hold. Keep the recovery bounded.
    localization_recovery_timeout: 120.0
    # 0.10 rad/s is about 5.7 deg/s. It gives the image matcher several
    # overlapping, less blurred views during a full recovery rotation.
    localization_recovery_angular_speed: 0.10
    localization_recovery_confirmation_time: 1.0
    replan_after_relocalization_timeout: 15.0
    replan_request_topic: /navigation/replan_request
    max_path_deviation_m: 0.50
    # If clear near-field sensing and fresh local odometry show less than 4 cm
    # progress for 2.5 s, briefly raise speed to overcome a shallow slope or
    # drivetrain dead zone, then return to the normal 0.10 m/s automatically.
    odometry_topic: /navigation/odom
    obstacle_state_topic: /navigation/local_obstacles/state
    traction_progress_timeout: 2.5
    traction_progress_distance: 0.04
    traction_boost_speed: 0.15
    traction_boost_timeout: 2.0
    traction_observation_timeout: 0.80
    # Request an in-place turn when the forward corridor is blocked. The
    # independent safety gate above decides whether clearance is sufficient.
    obstacle_recovery_angular_speed: 0.20
    obstacle_recovery_timeout: 10.0
